name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Viewer (lint, types, unit, build, bundle budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  ingest:
    name: Ingest (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt
      - run: pip install -r ingest/requirements-dev.txt
      - run: ruff check ingest
      - run: ruff format --check ingest
      - run: pytest

  e2e:
    name: End-to-end (Playwright on mock data)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: npm ci
      - run: pip install -r ingest/requirements.txt
      - name: Generate mock library
        run: python -m ingest.run mock --out data --count 300
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Smoke, accessibility, fallback, resilience
        run: npx playwright test --project=e2e
      - name: Frame-time budget (report only on software GL)
        # GitHub runners have no GPU, so the 16.6 ms budget cannot be judged here. The test records the
        # numbers; run `npm run e2e:perf` with PERF_STRICT=1 on real hardware to enforce the budget.
        run: npx playwright test --project=perf
        env:
          PERF: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Viewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: crate-digger:ci
      - name: Ingest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingest
          push: false
          tags: crate-digger-ingest:ci
