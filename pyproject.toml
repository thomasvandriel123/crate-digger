[project]
name = "crate-digger-ingest"
version = "1.0.0"
description = "Builds library.json and optimised covers for the Crate Digger viewer."
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0", "numpy>=2.0", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["ingest/tests"]
addopts = "-q"
